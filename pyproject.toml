[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melodyverse"
version = "0.1.0"
description = "Listen to any track, transcribe its melody & chords to MIDI/audio, and compose new melodies in world styles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
separation = ["demucs>=4.0"]
polyphonic = ["basic-pitch>=0.3"]
dev = ["pytest>=7"]

[project.scripts]
melodyverse = "melodyverse.cli:main"

[tool.setuptools]
packages = ["melodyverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
